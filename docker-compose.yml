services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suggest-complaint-monolith
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suggest_complaint
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: super-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suggest-complaint-frontend
    depends_on:
      - app
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - app-network

  vk-bot:
    build:
      context: ./vk_bot
      dockerfile: Dockerfile
    container_name: suggest-complaint-vk-bot
    depends_on:
      kafka:
        condition: service_started
      app:
        condition: service_started
    environment:
      VK_TOKEN: ${VK_TOKEN}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_APPEAL_STATUS_CHANGED: ${KAFKA_TOPIC_APPEAL_STATUS_CHANGED:-appeal.status.changed}
    restart: unless-stopped
    networks:
      - app-network

  tg-bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: suggest-complaint-tg-bot
    depends_on:
      kafka:
        condition: service_started
      app:
        condition: service_started
    environment:
      TG_TOKEN: ${TG_TOKEN}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_APPEAL_STATUS_CHANGED: ${KAFKA_TOPIC_APPEAL_STATUS_CHANGED:-appeal.status.changed}
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: suggest-complaint-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: suggest_complaint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suggest_complaint"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: suggest-zookeeper
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    networks:
      - app-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: suggest-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CREATE_TOPICS: "appeal.status.changed:1:1"
    volumes:
      - kafka_data:/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:

networks:
  app-network:
    driver: bridge
