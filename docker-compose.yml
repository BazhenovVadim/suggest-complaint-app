  postgres:
    image: postgres:16-alpine
    container_name: suggest-complaint-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: suggest_complaint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suggest_complaint"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: