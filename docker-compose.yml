services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suggest-complaint-monolith
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suggest_complaint
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: super-secret-change-me
    ports:
      - "8080:8080"
    restart: unless-stopped

